taxonomy:
  id: cho-han-fx
  label: "cho-han FX research taxonomy"
  root: "FX Research"
  FX Research:
    Market: [Currency Market, Currency Pair, USD/JPY]
    Time: [Tick, 5m, 15m, 1h, 4h, 1D]
    Observation:
      Price: [Open, High, Low, Close, Return]
      Candle: [Body, Upper Wick, Lower Wick, Range]
      Volume: [Volume, Volume Change]
    Feature:
      Trend: [SMA, EMA, SMA Distance, EMA Slope]
      Momentum: [Return 1, Return 2, Return 4, Return 8]
      Volatility: [Rolling Standard Deviation, Rolling High-Low Range]
      Level: [Support, Resistance]
    Prediction:
      BQML: [Classification, Direction Probability, Return Prediction]
      Horizon: [t+1, t+2, t+4, t+8]
    Context:
      JEV: [Market State, Trend Context, Momentum Context, Volatility Context, Support Context, Resistance Context, Prediction Context]
      Decision Context: [UP, DOWN, RANGE, Explanation, Confidence]
    Validation:
      Backtest: [Time Ordered Split, Prediction vs Outcome, Actual Return, Predicted Probability, Predicted Direction, Outcome]
      Evaluation: [Accuracy, Precision, Recall, Log Loss, Calibration, Confusion Matrix]
      Risk Checks: [Data Leakage, Overfitting, Regime Change, Trading Cost]
    Human:
      Intuition: [Momentum Feeling, Market Roughness, Direction Feeling, Stopping Feeling]
      Hypothesis: [Pattern Hypothesis, Feature Hypothesis, Model Hypothesis, Context Hypothesis]
      Action: [Observe, Experiment, Record, Compare, Refine]
    System:
      Tool: [Data Tool, Chart Tool, Feature Tool, BQML Tool, JEV Tool, Backtest Tool]
      Record: [Prediction Journal, Decision Journal, Outcome Journal, Experiment Log]
  principles: [荒く作る, 観測を増やす, 候補を作る, 絞る, 予測する, 文脈化する, 検証する, 記録する, 学習する]
